<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="Styles/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>CREAR CUENTA</h1>
        <form id="formulario">
            <div class="campo">
                <i class="fa-solid fa-inbox"></i>
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="campo">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="contraseña" placeholder="Contraseña">
                <i class="fa-solid fa-eye" id="toggleContraseña"></i>
            </div>
            <div class="campo">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmarContraseña" placeholder="Confirmar contraseña">
            </div>
            <button type="submit">Registrarme</button>
        </form>
        <p id="mensajeExito" class="mensaje-exito" hidden>
            Tu cuenta quedó registrada en estado <strong>Pendiente</strong>. Debe ser aprobada por un administrador
            antes de que puedas iniciar sesión.
        </p>
        <p class="enlace">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script src="Scrips/registro.js"></script>

</body>

</html>
