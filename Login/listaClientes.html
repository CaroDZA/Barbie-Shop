<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="Styles/listaClientes.css">
    <link rel="stylesheet" href="Styles/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <a href="home.html" class="volver"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        <h1>LISTA DE CLIENTES</h1>
        <p id="mensajeGuardado" class="mensaje-exito"></p>

        <form id="formularioEditar" class="formulario-editar" hidden>
            <input type="hidden" id="idClienteEditar">
            <div class="campo">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="nombreCompletoEditar" placeholder="Nombre completo">
            </div>
            <div class="campo">
                <i class="fa-solid fa-calendar"></i>
                <input type="date" id="fechaNacimientoEditar" placeholder="Fecha de nacimiento">
            </div>
            <div class="campo">
                <i class="fa-solid fa-inbox"></i>
                <input type="email" id="correoEditar" placeholder="Correo" readonly>
            </div>
            <div class="acciones-form">
                <button type="submit">Actualizar</button>
                <button type="button" id="botonCancelarEdicion" class="secundario">Cancelar</button>
            </div>
        </form>

        <table id="tablaClientes">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre completo</th>
                    <th>Fecha de nacimiento</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script src="Scrips/listaClientes.js"></script>
    <script src="Scrips/menu.js"></script>

</body>

</html>
